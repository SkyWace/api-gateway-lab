# POC comparatif API Gateways — contexte microservices
# Socle commun (sans profil) : backends, Keycloak, Redis, validateur JWT.
# Une gateway = un profil : kong | apisix | traefik | scg. Outils : k6 (profil tools), Prometheus (profil obs).
#
#   docker compose --profile kong up -d --build
#   docker compose --profile tools run --rm k6 run /scripts/latency.js -e TARGET=kong
#
# Règle d'équité : chaque gateway a les mêmes limites CPU/RAM (x-gw-limits).
# Pour les tests de perf, lancer UNE seule gateway à la fois.

x-gw-limits: &gw-limits
  cpus: "1.0"
  mem_limit: 512m

x-backend: &backend
  build: ./backends
  image: lab/backend:1.0
  cpus: "0.5"
  mem_limit: 256m
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
    interval: 5s
    timeout: 2s
    retries: 10

services:
  # ---------------------------------------------------------------- backends
  catalog-1:
    <<: *backend
    environment: { PREFIX: /api/catalog, DATA_FILE: /data/catalog.json, INSTANCE_ID: catalog-1 }
    ports: ["9001:3000"]          # accès direct (baseline sans gateway + /admin/chaos)
  catalog-2:
    <<: *backend
    environment: { PREFIX: /api/catalog, DATA_FILE: /data/catalog.json, INSTANCE_ID: catalog-2 }
    ports: ["9002:3000"]
  orders:
    <<: *backend
    environment: { PREFIX: /api/orders, DATA_FILE: /data/orders.json, INSTANCE_ID: orders-1 }
    ports: ["9003:3000"]

  # ---------------------------------------------------------------- identité
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # iss figé : les tokens ont le même émetteur qu'ils soient demandés depuis l'hôte ou le réseau Docker
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./identity/realm-lab.json:/opt/keycloak/data/import/realm-lab.json:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  auth-validator:
    build: ./auth-validator
    image: lab/auth-validator:1.0
    environment:
      EXPECTED_ISS: http://keycloak:8080/realms/lab
      PUBLIC_KEY_PATH: /keys/lab-public.pem
    volumes: ["./identity/keys/lab-public.pem:/keys/lab-public.pem:ro"]
    cpus: "0.5"
    mem_limit: 128m
    profiles: ["traefik"]

  redis:
    image: redis:7.4-alpine
    profiles: ["scg"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------- gateways
  kong:
    image: kong:3.9.1               # dernière lignée OSS (Apache 2.0) — voir docs/02-architecture.md
    profiles: ["kong"]
    <<: *gw-limits
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_NGINX_WORKER_PROCESSES: "1"
    volumes: ["./gateways/kong:/kong:ro"]
    ports: ["8001:8000", "18001:8001", "18100:8100"]
    depends_on:
      catalog-1: { condition: service_healthy }
      catalog-2: { condition: service_healthy }
      orders: { condition: service_healthy }

  apisix:
    image: apache/apisix:3.11.0-debian
    profiles: ["apisix"]
    <<: *gw-limits
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./gateways/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateways/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    ports: ["8002:9080", "19091:9091"]
    depends_on:
      catalog-1: { condition: service_healthy }
      catalog-2: { condition: service_healthy }
      orders: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  traefik:
    image: traefik:v3.3
    profiles: ["traefik"]
    <<: *gw-limits
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes: ["./gateways/traefik:/etc/traefik:ro"]
    ports: ["8003:80", "18083:8080", "18082:8082"]
    depends_on:
      catalog-1: { condition: service_healthy }
      catalog-2: { condition: service_healthy }
      orders: { condition: service_healthy }
      auth-validator: { condition: service_started }

  scg:
    build: ./gateways/scg
    image: lab/scg:1.0
    profiles: ["scg"]
    <<: *gw-limits
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports: ["8004:8080"]
    depends_on:
      catalog-1: { condition: service_healthy }
      catalog-2: { condition: service_healthy }
      orders: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ---------------------------------------------------------------- outils
  k6:
    image: grafana/k6:0.57.0
    profiles: ["tools"]
    user: "0:0"            # pour écrire dans ./results quel que soit l'utilisateur de l'hôte
    volumes:
      - ./tests/k6:/scripts:ro
      - ./results:/results
    environment:
      KEYCLOAK_URL: http://keycloak:8080

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["obs"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
